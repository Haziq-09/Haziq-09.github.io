<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhamad Haziq Bin Noor Azman - Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        .avatar {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: #ffffff;
            font-size: 32px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        h1 {
            font-size: 1.5rem;
            color: #f8fafc;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .role {
            font-size: 0.95rem;
            color: #38bdf8;
            font-weight: 500;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-section {
            border-top: 1px solid #334155;
            padding-top: 20px;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .label {
            color: #94a3b8;
        }

        .value {
            color: #f1f5f9;
            font-weight: 500;
            background: #0f172a;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">M</div>
        <h1>Muhamad Haziq Bin Noor Azman</h1>
        <div class="role">IT Technician</div>
        
        <div class="info-section">
            <div class="info-item">
                <span class="label">Kemahiran</span>
                <span class="value">Linux</span>
            </div>
            <div class="info-item">
                <span class="label">Fakta Menarik</span>
                <span class="value">Introvert</span>
            </div>
        </div>
    </div>

</body>
</html>
